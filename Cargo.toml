[package]
name = "xmip-core-library-ntlm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-library-ntlm"
description = "The NTLM message layout for Xmip: NEGOTIATE, CHALLENGE and AUTHENTICATE, read and written; and the NTLMv2 response, computed once."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# The estate's encoding primitives: UTF-16, which NTLM writes its names in,
# and the FILETIME its timestamp counts (codec::filetime).
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }
# The NTLMv2 response (MS-NLMP 3.3.2, `response`): the NT hash is MD4 of the
# password, and the response HMAC-MD5 twice over, the HMAC the estate's
# (codec::digest::hmac_by).
md4 = "0.11"
md-5 = "0.11"

[lints]
workspace = true
